# Builds the Android APK for free on GitHub Actions (public repos: free; private repos: within the free monthly minutes).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the runner; installed if missing)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools" && cd "$SDK/cmdline-tools"
            curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q tools.zip && mv cmdline-tools latest && rm tools.zip
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.EM_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.EM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.EM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "EM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "EM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "EM_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            # No saved key yet: create a one-off key so the APK is still installable.
            # Add your own key as repository secrets (see INSTALL_GUIDE.md) so future updates install over this version.
            P=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -alias em -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=English Mastery, O=Personal, C=IN"
            echo "::add-mask::$P"
            echo "EM_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "EM_KEY_ALIAS=em" >> "$GITHUB_ENV"
            echo "EM_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi
          echo "EM_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../EnglishMastery.apk
          ls -la ../*.apk

      - name: Verify APK signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs EnglishMastery.apk
          $BT/aapt dump badging EnglishMastery.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishMastery-apk
          path: EnglishMastery.apk
          retention-days: 30

      - name: Publish download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: English Mastery v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Install on Android: download **EnglishMastery.apk** below, open it, allow "Install unknown apps", Install.
            Signing key: ${{ steps.sign.outputs.persistent == 'true' && 'permanent (updates install over the old version)' || 'temporary (uninstall the old version before installing this one)' }}
          files: EnglishMastery.apk
